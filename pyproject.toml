[project]
name = "sop-agent"
version = "0.1.0"
description = "SOP-guided insurance claims agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "anthropic",
    "python-dateutil",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs ANTHROPIC_API_KEY"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
